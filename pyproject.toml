[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytunnel"
version = "0.2.0"
description = "Manage persistent SSH tunnels (local, remote, dynamic forwards) via OpenSSH ControlMaster"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml"]
dev = ["pytest", "pytest-cov", "pyyaml"]

[project.scripts]
pytunnel = "pytunnel:cli"

[tool.setuptools]
py-modules = ["pytunnel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
